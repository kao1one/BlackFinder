<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.json"><title>Localizador</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:8px;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));font:16px/1.35 system-ui,sans-serif;background:#000;color:#eee}
button,select,input,textarea{font:inherit;color:#eee;background:#1c1c1c;border:1px solid #444;border-radius:6px;padding:10px;box-sizing:border-box}
textarea,input[type=search],select{width:100%;margin:4px 0}
#bar,#bar2{display:flex;gap:6px;margin-top:6px}#bar button,#bar2 button{flex:1}#pc,#pr{flex:1;min-width:0}.bar{display:flex;align-items:center;gap:6px;padding:2px 6px}.bar span{flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.bar u{flex:1;display:block;text-decoration:none}.bar i{display:block;height:14px;background:#46c;border-radius:3px}
h3{margin:12px 0 2px;padding:2px 6px;background:#223;font-size:16px}
.r{padding:4px 6px;border-bottom:1px solid #222}.m{color:#f66}#st{color:#9c9;margin:4px 0}
#dout .r{cursor:pointer}#ed input{width:100%;margin:4px 0}[hidden]{display:none!important}
</style></head><body>
<div id="bar"><button id="bp">Colar</button><button id="bc">Copiar</button><button id="bx">Limpar</button><button id="bk">Catálogo</button><button id="be">Editar</button></div>
<div id="bar2"><button id="bf">Finalizar pedido</button><button id="bro">Relatório</button><button id="ban">Análise</button></div>
<textarea id="in" rows="4" placeholder="Cole os códigos do pedido" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
<div style="display:flex;gap:6px"><input id="pc" list="lc" placeholder="Cliente" autocomplete="off"><input id="pr" list="lr" placeholder="Região" autocomplete="off"></div><datalist id="lc"></datalist><datalist id="lr"></datalist><div id="pm" style="color:#9c9"></div>
<input id="ds" type="search" placeholder="Buscar por descrição ou código parcial" autocomplete="off">
<div id="dout"></div><div id="st"></div><div id="out"></div><div id="ver" style="color:#777;font-size:12px;margin-top:10px">BlackFinder v8</div>
<div id="an" hidden>
<h3>Análise</h3>
<div style="display:flex;gap:6px"><select id="ap"><option value="7">Últimos 7 dias</option><option value="30">Últimos 30 dias</option><option value="0">Tudo</option></select><select id="ar"></select></div>
<button id="ag" style="width:100%;margin:6px 0">Gerar relatório</button>
<div id="at"></div></div>
<div id="rp" hidden>
<h3>Relatório</h3>
<button id="bxp">Exportar pedidos (CSV)</button>
<div id="rt"></div></div>
<div id="ed" hidden>
<h3>Editar item</h3>
<input id="ec" placeholder="Código (AB-12345 ou só 12345)" autocomplete="off">
<button id="ev">Ver atual</button>
<input id="el" list="ls" placeholder="Local" autocomplete="off"><datalist id="ls"></datalist>
<input id="eds" placeholder="Descrição (opcional)" autocomplete="off">
<div style="display:flex;gap:6px"><button id="es" style="flex:1">Salvar</button><button id="er" style="flex:1">Remover</button><button id="ex" style="flex:1">Exportar CSV</button></div>
<div id="em" class="r"></div></div>
<div id="cat" hidden>
<h3>Catálogo</h3>
<input id="fi" type="file" accept=".csv,.tsv,.txt,text/*">
<textarea id="raw" rows="4" placeholder="ou cole a planilha aqui (CSV/TSV com colunas código, local, descrição)"></textarea>
<button id="ba">Analisar</button>
<div id="map" hidden>
<label><input type="checkbox" id="hh"> primeira linha é cabeçalho</label>
Código <select id="sc"></select>Local <select id="sl"></select>Local (2ª parte) <select id="sl2"></select>Descrição <select id="sd"></select>
<div id="pv" class="r"></div><button id="bs">Salvar catálogo</button>
</div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ck=s=>s.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
const zs=s=>s.replace(/^0+(?=.)/,'');
const col=new Intl.Collator('pt',{numeric:true}).compare;
let rows=[],byCode=new Map(),byZ=new Map(),byNum=new Map(),inv=new Map(),tk=[],pend=null,lastText='';

function build(){
  byCode=new Map();byZ=new Map();byNum=new Map();inv=new Map();
  for(let i=0;i<rows.length;i++){
    const r=rows[i],k=ck(r[0]);if(!k)continue;
    let a=byCode.get(k);if(a)a.push(i);else byCode.set(k,[i]);
    const z=zs(k);a=byZ.get(z);if(a)a.push(i);else byZ.set(z,[i]);
    const mn=k.match(/^[A-Z]*(\d+)$/);if(mn){const n=zs(mn[1]);a=byNum.get(n);if(a)a.push(i);else byNum.set(n,[i])}
    for(const t of norm(r[2]+' '+r[0]).split(/[^a-z0-9]+/)){
      if(!t)continue;const l=inv.get(t);
      if(!l)inv.set(t,[i]);else if(l[l.length-1]!==i)l.push(i);
    }
  }
  tk=[...inv.keys()].sort();
}
function lb(t){let a=0,b=tk.length;while(a<b){const m=(a+b)>>1;if(tk[m]<t)a=m+1;else b=m}return a}

function run(){
  if($('in').value.trim()){if(!t0)t0=Date.now()}else t0=0;
  const toks=$('in').value.replace(/\bc[oó]digos?\b\.?/gi,' ').replace(/\b([A-Za-z]{1,4})[\s\-_.]+(?=\d)/g,'$1').split(/[\s,;|]+/).filter(Boolean);
  const cnt=new Map();
  for(const x of toks){const k=ck(x);cnt.set(k,(cnt.get(k)||0)+1)}
  const found=[],miss=[];
  for(const [k,n] of cnt){
    let ids=byCode.get(k)||byZ.get(zs(k)),amb=false;
    if(!ids&&/^\d+$/.test(k)){ids=byNum.get(zs(k));amb=!!ids&&new Set(ids.map(i=>ck(rows[i][0]))).size>1}
    if(!ids)miss.push([k,n]);
    else for(const i of ids)found.push([rows[i][1],rows[i][0],rows[i][2],n,amb]);
  }
  found.sort((a,b)=>col(a[0],b[0])||col(a[1],b[1]));
  lastF=found;lastM=miss;
  let h='',t='',last=null;
  for(const f of found){
    if(f[0]!==last){last=f[0];h+='<h3>'+esc(f[0]||'(sem local)')+'</h3>'}
    h+='<div class="r">'+esc(f[1])+' '+esc(f[2])+(f[3]>1?' <b>×'+f[3]+'</b>':'')+(f[4]?' <b class="m">⚠ mesmo nº, outro prefixo</b>':'')+'</div>';
    t+=(f[0]||'(sem local)')+' | '+f[1]+' | '+f[2]+(f[3]>1?' | x'+f[3]:'')+(f[4]?' | ⚠ mesmo nº, outro prefixo':'')+'\n';
  }
  if(miss.length){
    h='<h3 class="m">NÃO ENCONTRADOS ('+miss.length+')</h3>'+miss.map(m=>'<div class="r m">'+esc(m[0])+(m[1]>1?' ×'+m[1]:'')+'</div>').join('')+h;
    t+='\nNÃO ENCONTRADOS: '+miss.map(m=>m[0]).join(', ')+'\n';
  }
  lastText=t;$('out').innerHTML=h;
  $('st').textContent=!rows.length?'Catálogo vazio: abra Catálogo e importe.':cnt.size?found.length+' localizações, '+miss.length+' não encontrados, '+cnt.size+' códigos únicos':rows.length+' produtos no catálogo';
}
function dsearch(){
  const ts=norm($('ds').value).split(/[^a-z0-9]+/).filter(Boolean);
  if(!ts.length){$('dout').innerHTML='';return}
  let res=null;
  for(const t of ts){
    const s=new Set();
    for(let i=lb(t);i<tk.length&&tk[i].startsWith(t);i++)for(const id of inv.get(tk[i]))s.add(id);
    res=res===null?s:new Set([...res].filter(x=>s.has(x)));
    if(!res.size)break;
  }
  const ids=[...res].slice(0,60);
  $('dout').innerHTML=ids.length?ids.map(i=>'<div class="r" data-c="'+esc(rows[i][0])+'"><b>'+esc(rows[i][1])+'</b> '+esc(rows[i][0])+' '+esc(rows[i][2])+'</div>').join('')+(res.size>60?'<div class="r">+'+(res.size-60)+' resultados, refine a busca</div>':''):'<div class="r m">Nada encontrado</div>';
}

/* ---- importação ---- */
function sp(l,d){
  if(l.indexOf('"')<0)return l.split(d).map(s=>s.trim());
  const o=[];let c='',q=false;
  for(let i=0;i<l.length;i++){const ch=l[i];
    if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===d){o.push(c.trim());c=''}else c+=ch;
  }
  o.push(c.trim());return o;
}
function analyze(txt){
  const lines=txt.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return $('st').textContent='Nada para analisar.';
  let d=',',best=-1;
  for(const x of ['\t',';','|',',']){const c=lines[0].split(x).length;if(c>best){best=c;d=x}}
  if(best<2)return $('st').textContent='Não detectei colunas (separador tab, ; | ou vírgula).';
  pend=lines.map(l=>sp(l,d));
  const n=pend[0].length,h=pend[0].map(norm);
  const R={c:/^(cod|sku|ref|ean|id|item)/,l:/(local|endere|corredor|prateleira|posi|rua|setor|gondola|box|bloco)/,d:/(desc|produto|nome)/};
  const g=(re,def)=>{const i=h.findIndex(x=>re.test(x));return i<0?def:i};
  const hasH=h.some(x=>R.c.test(x)||R.l.test(x)||R.d.test(x));
  $('hh').checked=hasH;fill();
  if(hasH){$('sc').value=g(R.c,0);$('sl').value=g(R.l,Math.min(1,n-1));
    const dd=g(R.d,-1);$('sd').value=dd;}
  else{$('sc').value=0;$('sl').value=Math.min(1,n-1);$('sd').value=n>2?2:-1}
  $('sl2').value=-1;preview();$('map').hidden=false;
  $('st').textContent=(pend.length-(hasH?1:0))+' linhas lidas. Confira as colunas e salve.';
}
function fill(){
  const n=pend[0].length,hd=$('hh').checked;let a='';
  for(let i=0;i<n;i++)a+='<option value="'+i+'">'+esc(hd?pend[0][i]:'Coluna '+(i+1))+'</option>';
  const none='<option value="-1">(nenhuma)</option>';
  $('sc').innerHTML=a;$('sl').innerHTML=a;$('sl2').innerHTML=none+a;$('sd').innerHTML=none+a;
}
function preview(){
  const x=pend[$('hh').checked?1:0]||[],g=s=>+$(s).value;
  $('pv').textContent='Exemplo: código='+(x[g('sc')]||'')+' | local='+(x[g('sl')]||'')+(g('sl2')>=0?'-'+(x[g('sl2')]||''):'')+' | desc='+(g('sd')>=0?x[g('sd')]||'':'');
}
async function save(){
  const s=$('hh').checked?1:0,c=+$('sc').value,l=+$('sl').value,l2=+$('sl2').value,d=+$('sd').value,r=[];
  for(let i=s;i<pend.length;i++){
    const x=pend[i],code=(x[c]||'').trim();if(!code)continue;
    let loc=(x[l]||'').trim();
    if(l2>=0){const y=(x[l2]||'').trim();if(y)loc=loc?loc+'-'+y:y}
    r.push([code,loc,d>=0?(x[d]||'').trim():'']);
  }
  if(!r.length)return $('st').textContent='Nenhuma linha válida: confira a coluna de código.';
  try{await idbSet('cat',r)}catch(e){return $('st').textContent='Erro ao gravar: '+e}
  rows=r;build();pend=null;$('map').hidden=true;$('cat').hidden=true;$('raw').value='';
  const dup=rows.length-byCode.size;
  run();$('st').textContent=rows.length+' produtos salvos'+(dup>0?' ('+dup+' linhas com código repetido, todas as localizações serão exibidas)':'')+'.';
}

/* ---- armazenamento ---- */
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('loc',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
async function idbGet(k){const d=await idb();return new Promise((ok,no)=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})}

/* ---- eventos ---- */
$('in').addEventListener('input',run);
$('ds').addEventListener('input',dsearch);
$('dout').addEventListener('click',e=>{const r=e.target.closest('[data-c]');if(!r)return;const i=$('in');i.value+=(i.value&&!/\s$/.test(i.value)?'\n':'')+r.dataset.c+'\n';run()});
$('bx').onclick=()=>{$('in').value='';$('ds').value='';$('dout').innerHTML='';run()};
$('bk').onclick=()=>{$('cat').hidden=!$('cat').hidden};
$('bp').onclick=async()=>{try{$('in').value=await navigator.clipboard.readText();run()}catch(e){$('st').textContent='Sem permissão para ler a área de transferência: cole manualmente.'}};
$('bc').onclick=async()=>{try{await navigator.clipboard.writeText(lastText);$('st').textContent='Copiado.'}catch(e){$('st').textContent='Não consegui copiar.'}};
$('ba').onclick=()=>analyze($('raw').value);
$('hh').onchange=()=>{if(pend){fill();$('sc').value=0;$('sl').value=Math.min(1,pend[0].length-1);preview()}};
for(const s of ['sc','sl','sl2','sd'])$(s).onchange=preview;
$('bs').onclick=save;
$('fi').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const b=await f.arrayBuffer();let t;
  try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(_){t=new TextDecoder('windows-1252').decode(b)}
  analyze(t);
};

/* ---- edição de item ---- */
const em=t=>{$('em').textContent=t};
function resolve(q){
  const k=ck(q);if(!k)return null;
  let ids=byCode.get(k)||byZ.get(zs(k));
  if(!ids&&/^\d+$/.test(k)){ids=byNum.get(zs(k));if(ids&&new Set(ids.map(i=>ck(rows[i][0]))).size>1)return{amb:ids}}
  return ids?{ids}:null;
}
function locs(){const s=new Set(rows.map(r=>r[1]).filter(Boolean));$('ls').innerHTML=[...s].sort(col).map(x=>'<option value="'+esc(x)+'">').join('')}
async function gravar(nr){try{await idbSet('cat',nr)}catch(e){em('Erro ao gravar: '+e);return false}rows=nr;build();locs();run();return true}
const ambMsg=r=>'Número repetido em prefixos diferentes ('+[...new Set(r.amb.map(i=>rows[i][0]))].join(', ')+'): digite o código completo.';
$('be').onclick=()=>{$('ed').hidden=!$('ed').hidden;if(!$('ed').hidden)locs()};
$('ev').onclick=()=>{
  const r=resolve($('ec').value);
  if(!r)return em('Código não existe no catálogo. "Salvar" cria um novo (com prefixo).');
  if(r.amb)return em(ambMsg(r));
  const x=rows[r.ids[0]];$('ec').value=x[0];$('el').value=x[1];$('eds').value=x[2];
  em(r.ids.map(i=>rows[i][0]+' @ '+(rows[i][1]||'(sem local)')).join(' | '));
};
$('es').onclick=async()=>{
  const q=$('ec').value.trim(),loc=$('el').value.trim(),d=$('eds').value.trim();
  if(!q||!loc)return em('Preencha código e local.');
  const r=resolve(q);
  if(r&&r.amb)return em(ambMsg(r));
  let nr,msg;
  if(r){
    const f=r.ids[0],drop=new Set(r.ids.slice(1));
    nr=rows.slice();nr[f]=[rows[f][0],loc,d||rows[f][2]];nr=nr.filter((_,i)=>!drop.has(i));
    msg=rows[f][0]+' agora está em '+loc+(drop.size?' ('+drop.size+' local(is) antigo(s) removido(s))':'');
  }else{
    const m=q.match(/^([A-Za-z]{1,4})[\s\-_.]*(\d+)$/);
    if(!m)return em('Código novo precisa de prefixo e número (ex.: AB-12345).');
    const code=m[1].toUpperCase()+'-'+m[2];
    nr=rows.concat([[code,loc,d]]);msg=code+' criado em '+loc;
  }
  if(await gravar(nr))em('OK: '+msg);
};
$('er').onclick=async()=>{
  const r=resolve($('ec').value);
  if(!r)return em('Código não existe no catálogo.');
  if(r.amb)return em(ambMsg(r));
  const nm=r.ids.map(i=>rows[i][0]+' @ '+rows[i][1]).join(', ');
  if(!confirm('Remover do catálogo: '+nm+'?'))return;
  const drop=new Set(r.ids);
  if(await gravar(rows.filter((_,i)=>!drop.has(i)))){$('ec').value='';$('el').value='';$('eds').value='';em('Removido: '+nm)}
};
$('ex').onclick=()=>{
  const q=v=>/[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  const t='codigo;local;descricao\r\n'+rows.map(r=>r.map(q).join(';')).join('\r\n')+'\r\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='catalogo.csv';
  document.body.appendChild(a);a.click();a.remove();em('catalogo.csv exportado ('+rows.length+' linhas) em Downloads.');
};

/* ---- pedidos e relatório ---- */
let ped=[],lastF=[],lastM=[],t0=0,syncing=false;
const pm=t=>{$('pm').textContent=t};
const nk=s=>norm(s).replace(/\s+/g,' ').trim();
function listas(){
  const f=k=>[...new Map(ped.filter(p=>p[k]).map(p=>[nk(p[k]),p[k]])).values()].sort(col).map(x=>'<option value="'+esc(x)+'">').join('');
  $('lc').innerHTML=f('cliente');$('lr').innerHTML=f('regiao');
}
async function sync(){
  const pend=ped.filter(p=>!p.enviado);
  if(syncing||!pend.length)return;
  syncing=true;
  try{
    const r=await fetch('/api/pedidos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pend.map(({enviado,...x})=>x))});
    if(r.ok){const ok=new Set((await r.json()).salvos);ped=ped.map(p=>ok.has(p.id)?{...p,enviado:true}:p);await idbSet('ped',ped)}
  }catch(_){}
  syncing=false;
}
$('bf').onclick=async()=>{
  const u=new Map();for(const f of lastF)u.set(f[1],f[3]);
  if(!u.size&&!lastM.length)return pm('Nada para finalizar: cole os códigos do pedido.');
  const now=Date.now(),p={id:now.toString(36)+Math.random().toString(36).slice(2,6),ini:t0||now,fim:now,
    cliente:$('pc').value.trim(),regiao:$('pr').value.trim(),itens:[...u],naoEnc:lastM.slice(),enviado:false};
  const nr=ped.concat([p]);
  try{await idbSet('ped',nr)}catch(e){return pm('Erro ao gravar o pedido: '+e)}
  ped=nr;listas();
  $('in').value='';$('pc').value='';$('pr').value='';t0=0;run();
  pm('Pedido salvo: '+p.itens.length+' itens, '+p.naoEnc.length+' não encontrados, '+Math.max(1,Math.round((p.fim-p.ini)/60000))+' min.');
  sync();
};
$('bro').onclick=()=>{$('rp').hidden=!$('rp').hidden;if(!$('rp').hidden)rel()};
function rel(){
  const R=$('rt');
  if(!ped.length){R.innerHTML='<div class="r">Nenhum pedido finalizado ainda.</div>';return}
  const add=(m,k,n)=>m.set(k,(m.get(k)||0)+n),top=(m,n)=>[...m].sort((a,b)=>b[1]-a[1]).slice(0,n);
  const prod=new Map(),reg=new Map(),rn=new Map(),pr=new Map(),cli=new Map(),nf=new Map();
  let dur=0,it=0,un=0,nn=0;
  for(const p of ped){
    dur+=Math.max(0,p.fim-p.ini);
    const rk=nk(p.regiao)||'(sem região)';if(!rn.has(rk))rn.set(rk,p.regiao||rk);add(reg,rk,1);
    const k=nk(p.cliente);if(k){const c=cli.get(k)||{n:p.cliente,q:0,u:0};c.q++;c.u=Math.max(c.u,p.fim);cli.set(k,c)}
    const m=pr.get(rk)||new Map();pr.set(rk,m);
    for(const [c,q] of p.itens){add(prod,c,q);add(m,c,q);it++;un+=q}
    for(const [c,q] of p.naoEnc){add(nf,c,q);nn++}
  }
  const L=a=>a.length?a.map(x=>'<div class="r">'+x+'</div>').join(''):'<div class="r">(sem dados ainda)</div>',H=t=>'<h3>'+t+'</h3>';
  const at=c=>{const i=byCode.get(ck(c));return i?' @ '+esc(rows[i[0]][1]):''};
  const n=ped.length,fm=t=>new Date(t).toLocaleDateString('pt-BR');
  R.innerHTML=
    H('Resumo')+L([n+' pedidos, de '+fm(Math.min(...ped.map(p=>p.ini)))+' a '+fm(Math.max(...ped.map(p=>p.fim))),
      'Tempo médio: '+(dur/n/60000).toFixed(1)+' min',
      'Por pedido: '+(it/n).toFixed(1)+' itens, '+(un/n).toFixed(1)+' unidades',
      'Códigos não encontrados: '+(it+nn?Math.round(100*nn/(it+nn)):0)+'%',
      'Pedidos ainda não enviados ao servidor: '+ped.filter(p=>!p.enviado).length])+
    H('Produtos mais pedidos')+L(top(prod,10).map(([c,q])=>esc(c)+at(c)+' ×'+q))+
    H('Regiões')+L(top(reg,8).map(([k,v])=>esc(rn.get(k))+': '+v+' pedido(s)'))+
    H('Produtos por região')+L(top(reg,5).map(([k])=>'<b>'+esc(rn.get(k))+'</b>: '+top(pr.get(k),3).map(([c,q])=>esc(c)+' ×'+q).join(', ')))+
    H('Clientes recorrentes')+L([...cli.values()].filter(c=>c.q>1).sort((a,b)=>b.q-a.q).slice(0,10).map(c=>esc(c.n)+': '+c.q+' pedidos, último em '+fm(c.u)))+
    H('Não encontrados recorrentes (catálogo desatualizado?)')+L(top(nf,10).filter(x=>x[1]>1).map(([c,q])=>'<span class="m">'+esc(c)+' ×'+q+'</span>'));
}
$('bxp').onclick=()=>{
  const q=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const t='id;inicio;fim;minutos;cliente;regiao;itens;unidades;nao_encontrados;codigos\r\n'+ped.map(p=>[p.id,new Date(p.ini).toISOString(),new Date(p.fim).toISOString(),Math.round((p.fim-p.ini)/6000)/10,p.cliente,p.regiao,p.itens.length,p.itens.reduce((s,x)=>s+x[1],0),p.naoEnc.length,p.itens.map(x=>x[0]+(x[1]>1?'x'+x[1]:'')).join(' ')].map(q).join(';')).join('\r\n')+'\r\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='pedidos.csv';
  document.body.appendChild(a);a.click();a.remove();pm('pedidos.csv exportado ('+ped.length+' pedidos) em Downloads.');
};

/* ---- análise gráfica e indicações ---- */
const MIN_PED=10,MIN_SUP=3,MIN_CONF=.5;
const HH=t=>'<h3>'+t+'</h3>',LL=a=>a.length?a.map(x=>'<div class="r">'+x+'</div>').join(''):'<div class="r">(sem dados)</div>';
const loc1=c=>{const i=byCode.get(ck(c));return i?rows[i[0]][1]:''};
function filtrar(){
  const d=+$('ap').value,r=$('ar').value,lim=d?Date.now()-d*864e5:0;
  return ped.filter(p=>p.fim>=lim&&(!r||(nk(p.regiao)||'(sem região)')===r));
}
function barras(a){
  const mx=Math.max(1,...a.map(x=>x[1]));
  return a.length?a.map(([l,v])=>'<div class="bar"><span>'+l+'</span><u><i style="width:'+Math.max(2,Math.round(100*v/mx))+'%"></i></u><b>'+v+'</b></div>').join(''):'<div class="r">(sem dados)</div>';
}
function indicacoes(P){
  if(P.length<MIN_PED)return HH('Indicações do agente')+LL(['Dados insuficientes: '+P.length+' de '+MIN_PED+' pedidos mínimos neste filtro. O agente só opina com amostra mínima.']);
  const un=new Map(),par=new Map(),gl=new Map(),rg=new Map(),nfc=new Map(),cli=new Map(),inc=(m,k)=>m.set(k,(m.get(k)||0)+1);
  for(const p of P){
    const s=[...new Set(p.itens.map(x=>x[0]))].sort();
    s.forEach(c=>{inc(un,c);inc(gl,c)});
    if(s.length<=40)for(let i=0;i<s.length;i++)for(let j=i+1;j<s.length;j++)inc(par,s[i]+'\t'+s[j]);
    const rk=nk(p.regiao)||'(sem região)';let m=rg.get(rk);if(!m){m={n:0,d:p.regiao||rk,c:new Map()};rg.set(rk,m)}
    m.n++;s.forEach(c=>inc(m.c,c));
    new Set(p.naoEnc.map(x=>x[0])).forEach(c=>inc(nfc,c));
    const k=nk(p.cliente);if(k){const c=cli.get(k)||{n:p.cliente,t:[]};c.t.push(p.fim);cli.set(k,c)}
  }
  const rs=[];
  for(const [k,n] of par){if(n<MIN_SUP)continue;const [a,b]=k.split('\t');for(const [x,y] of [[a,b],[b,a]]){const c=n/un.get(x);if(c>=MIN_CONF)rs.push([x,y,n,c])}}
  rs.sort((a,b)=>b[3]-a[3]||b[2]-a[2]);
  const rr=[];
  for(const [,m] of rg){if(m.n<5)continue;let b=null;for(const [c,n] of m.c){if(n<MIN_SUP)continue;const l=(n/m.n)/(gl.get(c)/P.length);if(l>=2&&(!b||l>b[2]))b=[c,n,l]}if(b)rr.push(esc(m.d)+': '+esc(b[0])+' sai '+b[2].toFixed(1)+'× mais que na média ('+b[1]+' de '+m.n+' pedidos)')}
  const nf=[...nfc].filter(x=>x[1]>=3).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([c,n])=>esc(c)+' não encontrado em '+n+' pedidos: considere cadastrar');
  const now=Date.now(),cl=[];
  for(const c of cli.values()){if(c.t.length<3)continue;c.t.sort((a,b)=>a-b);const iv=(c.t[c.t.length-1]-c.t[0])/(c.t.length-1),sem=now-c.t[c.t.length-1];if(iv>=864e5&&sem>2*iv)cl.push([sem/iv,esc(c.n)+' costuma pedir a cada ~'+Math.round(iv/864e5)+' dia(s) e está há '+Math.round(sem/864e5)+' sem pedir'])}
  cl.sort((a,b)=>b[0]-a[0]);
  return HH('Indicações do agente ('+P.length+' pedidos)')+
    HH('Itens que saem juntos')+LL(rs.slice(0,8).map(([x,y,n,c])=>esc(x)+' → '+esc(y)+(loc1(y)?' @ '+esc(loc1(y)):'')+': '+Math.round(c*100)+'% ('+n+' pedidos)'))+
    HH('Produto forte por região')+LL(rr.slice(0,6))+
    HH('Possível recompra')+LL(cl.slice(0,5).map(x=>x[1]))+
    HH('Catálogo')+LL(nf);
}
async function alertas(){
  const e=$('al');
  try{
    const r=await fetch('/api/alertas');if(!r.ok)throw 0;
    const a=await r.json();
    e.innerHTML=a.length?LL(a.slice(-15).reverse().map(x=>new Date(x.ts).toLocaleString('pt-BR')+' <b>'+esc(x.titulo)+'</b>: '+esc(x.texto))):'<div class="r">Nenhum alerta. Tudo certo.</div>';
  }catch(_){e.innerHTML='<div class="r m">Servidor desligado: alertas indisponíveis (o supervisor só roda com o servidor ligado).</div>'}
}
$('ag').onclick=()=>{
  const P=filtrar(),pc=new Map(),rc=new Map();
  for(const p of P){
    const rk=nk(p.regiao)||'(sem região)',r=rc.get(rk)||[p.regiao||rk,0];r[1]++;rc.set(rk,r);
    for(const [c,q] of p.itens)pc.set(c,(pc.get(c)||0)+q);
  }
  const prod=[...pc].sort((a,b)=>b[1]-a[1]).slice(0,15).map(([c,q])=>[esc(c)+(loc1(c)?' @ '+esc(loc1(c)):''),q]);
  const reg=[...rc.values()].sort((a,b)=>b[1]-a[1]).slice(0,8).map(([d,n])=>[esc(d),n]);
  $('at').innerHTML=HH('Gerado em '+new Date().toLocaleString('pt-BR')+': '+P.length+' pedido(s)')+
    HH('Ranking de produtos (unidades pedidas)')+barras(prod)+HH('Pedidos por região')+barras(reg)+
    indicacoes(P)+HH('Alertas do supervisor')+'<div id="al"></div>';
  alertas();
};
$('ban').onclick=()=>{
  $('an').hidden=!$('an').hidden;if($('an').hidden)return;
  const m=new Map();for(const p of ped)m.set(nk(p.regiao)||'(sem região)',p.regiao||'(sem região)');
  const v=$('ar').value;
  $('ar').innerHTML='<option value="">Todas as regiões</option>'+[...m].sort((a,b)=>col(a[1],b[1])).map(([k,d])=>'<option value="'+esc(k)+'">'+esc(d)+'</option>').join('');
  $('ar').value=v;$('ag').onclick();
};

/* ---- início ---- */
(async()=>{
  try{const r=await idbGet('cat');if(r&&r.length){rows=r;build()}}catch(e){$('st').textContent='Erro ao abrir o catálogo: '+e}
  if(!rows.length)$('cat').hidden=false;
  try{ped=(await idbGet('ped'))||[]}catch(_){ped=[]}
  listas();sync();setInterval(sync,60000);
  run();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
  if('serviceWorker' in navigator){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__r){window.__r=1;location.reload()}});
    navigator.serviceWorker.register('/sw.js').then(r=>r.update()).catch(()=>{});
  }
})();
